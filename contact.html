<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact - Mario Rubio." />
    <title>CONTACT — Mario Rubio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="content-page">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <header class="site-header site-header--in-flow">
      <a class="site-brand site-nav-link" href="/">MARIO RUBIO</a>
      <nav class="site-nav" aria-label="Navegación principal">
        <a class="site-nav-link" href="/objects.html">OBJECTS</a>
        <a class="site-nav-link" href="/info.html">INFO</a>
        <a class="site-nav-link is-active" href="/contact.html" aria-current="page">CONTACT</a>
      </nav>
    </header>
    <main id="main">
      <section id="contact" class="contact" aria-labelledby="contact-title">
        <h1 id="contact-title" class="section-label">CONTACT</h1>
        <p class="contact-subtitle">GET IN TOUCH</p>
        <form class="contact-form" action="https://formspree.io/f/mppwkyjv" method="POST">
          <div class="contact-field">
            <label for="contact-name">NAME</label>
            <input id="contact-name" name="name" type="text" autocomplete="name" />
          </div>
          <div class="contact-field">
            <label for="contact-email">EMAIL</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="contact-field">
            <label for="contact-subject">SUBJECT</label>
            <input id="contact-subject" name="subject" type="text" required />
          </div>
          <div class="contact-field">
            <label for="contact-message">MESSAGE</label>
            <textarea id="contact-message" name="message" rows="5" required></textarea>
          </div>
          <input type="text" name="_gotcha" hidden tabindex="-1" autocomplete="off" />
          <button class="contact-send" type="submit" disabled>SEND</button>
          <p class="contact-status" role="status" aria-live="polite" aria-atomic="true"></p>
        </form>
        <div class="contact-socials">
          <a href="https://www.instagram.com/mariorubiosolana/" target="_blank" rel="noopener noreferrer" aria-label="Instagram profile of Mario Rubio">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
            </svg>
          </a>
          <a href="https://www.linkedin.com/in/mario-rubio-solana-8a35233a6/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile of Mario Rubio">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor">
              <path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96C2 21.32 2.69 22 3.55 22h16.9c.86 0 1.55-.68 1.55-1.52V3.52C22 2.68 21.31 2 20.45 2ZM7.93 18.75H4.98V9.2h2.95v9.55ZM6.45 7.9a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42Zm12.3 10.85H15.8V14.1c0-1.11-.02-2.54-1.55-2.54-1.55 0-1.79 1.21-1.79 2.46v4.73H9.51V9.2h2.83v1.3h.04c.39-.74 1.36-1.52 2.79-1.52 2.98 0 3.58 1.96 3.58 4.51v5.26Z" />
            </svg>
          </a>
        </div>
      </section>
    </main>
    <script type="module" src="/src/project-navigation.js"></script>
    <script type="module" src="/src/contact.js"></script>
  </body>
</html>

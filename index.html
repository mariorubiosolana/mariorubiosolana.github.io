    <title>Mario Rubio — Architecture</title>
    <script>
      // Decide before the first paint; project pages need no extra navigation code.
      (() => {
        const navigation = performance.getEntriesByType('navigation')[0]?.type
        let internal = false
        let played = false
        let skipOnce = false
        try {
          internal = !!document.referrer && new URL(document.referrer).origin === location.origin
          played = sessionStorage.getItem('introPlayed') === 'true'
          skipOnce = sessionStorage.getItem('skipIntroOnce') === 'true'
          sessionStorage.removeItem('skipIntroOnce')
        } catch { /* Storage may be unavailable in private browsing. */ }
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return
        if (navigation !== 'reload' && (internal || skipOnce || (played && navigation === 'back_forward'))) return
        document.documentElement.classList.add('intro-pending')
        // Fail open if the animation module cannot load.
        window.siteIntroFallback = setTimeout(() => {
          document.documentElement.classList.remove('intro-pending')
        }, 4000)
      })()
    </script>
